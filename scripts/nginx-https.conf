# 宿主机 Nginx 示例；替换域名与已有证书路径，不在容器内申请证书。
# Linux 默认网段下宿主机访问容器通常来自 172.30.0.1；核实后设置
# backend/.env 的 EDGE_PROXY_CIDR=172.30.0.1/32，禁止填写全网 CIDR。
# 云 LB 部署仅允许 frontend 绑定获批内网地址，并将 CIDR 限为 LB 来源。
server {
    listen 80;
    server_name notes.example.com;
    return 308 https://notes.example.com$request_uri;
}
server {
    listen 443 ssl;
    server_name notes.example.com;
    ssl_certificate /etc/nginx/certs/fullchain.pem;
    ssl_certificate_key /etc/nginx/certs/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    client_max_body_size 50m;
    location /metrics { return 403; }
    location /internal { return 404; }
    location / {
        proxy_pass http://127.0.0.1:5173;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 420s;
        proxy_send_timeout 420s;
    }
}
