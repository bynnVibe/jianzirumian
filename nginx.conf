# ============================================
# 见字如面 - Nginx 配置（层1 API Gateway）
# ============================================
# 本文件被包含进 http 上下文（conf.d/），因此 limit_req_zone 等指令可写在 server 之外。
# 角色：内部 API Gateway —— 静态资源下发 + 限流 + 路由；TLS 由外部反向代理终止：
#   /api/     -> Agent Service（层2，agent:8000）
#   /v1/      -> LLM Proxy（层3，llm-proxy:8001）
#   /metrics、/internal/ -> 禁止公共访问；Prometheus 走 Docker 内网直连
#   /、/assets/、/uploads/ -> 前端静态资源 / 上传文件代理
#
# 主机名通过环境变量注入（compose）：BACKEND_HOST=agent、LLM_PROXY_HOST=llm-proxy

# ---- 限流（层1 网关职责）----
# 按客户端 IP 限流：稳态 20 r/s，突发 40 个排队且不延迟；超限返回 429
limit_req_zone $binary_remote_addr zone=api:10m rate=20r/s;
limit_req_status 429;

# 仅信任明确配置的直接边缘代理；真实来源参与限流，伪造转发头被丢弃。
set_real_ip_from ${EDGE_PROXY_CIDR};
real_ip_header X-Forwarded-For;
real_ip_recursive on;
geo $realip_remote_addr $trusted_edge {
    default 0;
    ${EDGE_PROXY_CIDR} 1;
}
map "$trusted_edge:$http_x_forwarded_proto" $forwarded_scheme {
    default $scheme;
    "1:https" https;
    "1:http" http;
}

server {
    listen 80;
    server_name _;

    # 前端静态文件
    root /usr/share/nginx/html;
    index index.html;

    # 上传体积上限：nginx 默认 1m，超过会直接 413 拒绝且请求到不了后端
    # （表现为上传/OCR 预览报错但后端无日志）
    client_max_body_size 50m;

    # 压缩传输：JS/CSS 可缩小约 70%，显著加快低带宽服务器的首屏加载
    gzip on;
    gzip_vary on;
    gzip_comp_level 5;
    gzip_min_length 1k;
    gzip_types text/plain text/css application/json application/javascript
               text/xml application/xml application/xml+rss text/javascript
               image/svg+xml;

    # 前端路由 (SPA)；index.html 不缓存，保证发版后立刻生效
    location / {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        try_files $uri $uri/ /index.html;
    }

    # Vite 带内容哈希的构建产物，长期缓存；
    # 缺失的哈希资源必须返回 404，不能回退 index.html——
    # 否则浏览器缓存的旧 index.html 请求旧资源时会拿到 HTML（MIME 不符），
    # 模块脚本被拒绝执行，页面永远停在启动屏
    location /assets/ {
        expires 30d;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # API 代理到 Agent Service（层2），并限流
    location /api/ {
        limit_req zone=api burst=40 nodelay;
        proxy_pass http://${BACKEND_HOST}:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $forwarded_scheme;

        # OCR / LLM 调用耗时较长，放宽超时
        proxy_connect_timeout 60s;
        proxy_send_timeout 360s;
        proxy_read_timeout 360s;

        # SSE 支持：不缓冲流式响应
        proxy_buffering off;
        proxy_cache off;
        chunked_transfer_encoding on;
    }

    # 模型网关 OpenAI 兼容入口 -> LLM Proxy（层3），限流 + SSE 不缓冲
    location /v1/ {
        limit_req zone=api burst=40 nodelay;
        proxy_pass http://${LLM_PROXY_HOST}:8001;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $forwarded_scheme;

        proxy_connect_timeout 60s;
        proxy_send_timeout 360s;
        proxy_read_timeout 360s;

        proxy_buffering off;
        proxy_cache off;
        chunked_transfer_encoding on;
    }

    # 指标和内部诊断只能通过 Docker 内网访问。
    location /metrics { return 403; }
    location /internal { return 404; }

    # 上传文件静态访问代理
    location /uploads/ {
        proxy_pass http://${BACKEND_HOST}:8000/uploads/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_read_timeout 360s;
    }
}

# 外部 HTTPS 配置示例见 scripts/nginx-https.conf；此容器不申请或挂载证书。
