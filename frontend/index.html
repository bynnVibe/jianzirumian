<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>见字如面 - 手写笔记知识库</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@300;400;500;600;700&display=swap" rel="stylesheet" />
  <style>
    /* ---- 启动屏：JS 加载前的即时反馈 ---- */
    .app-splash {
      position: fixed; inset: 0;
      display: flex; flex-direction: column;
      align-items: center; justify-content: center;
      background: #f5f0ea;
      z-index: 9999;
      transition: opacity 0.4s ease;
    }
    .app-splash.fade-out {
      opacity: 0;
      pointer-events: none;
    }
    .splash-icon {
      width: 56px; height: 56px;
      background: linear-gradient(135deg, #d4852e, #e9bc7d);
      border-radius: 16px;
      display: flex; align-items: center; justify-content: center;
      margin-bottom: 16px;
      color: white;
    }
    .splash-icon svg { width: 32px; height: 32px; }
    .splash-title {
      font-size: 20px; font-weight: 700;
      color: #3a2e24; margin-bottom: 6px;
      font-family: -apple-system, "PingFang SC", sans-serif;
    }
    .splash-subtitle {
      font-size: 13px; color: #8c7e6e;
      margin-bottom: 32px;
      font-family: -apple-system, "PingFang SC", sans-serif;
    }
    .splash-spinner {
      width: 24px; height: 24px;
      border: 2.5px solid #ede6dc;
      border-top-color: #d4852e;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
  </style>
</head>
<body>
  <!-- 启动屏（在 #app 外部，Vue mount 不干扰，由 main.js 主动移除） -->
  <div class="app-splash" id="app-splash">
    <div class="splash-icon">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
        <path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2z"/>
        <path d="M12 6v6l4 2" stroke-linecap="round"/>
        <path d="M8 12c0 2.21 1.79 4 4 4" stroke-linecap="round"/>
      </svg>
    </div>
    <div class="splash-title">见字如面</div>
    <div class="splash-subtitle">手写笔记知识库</div>
    <div class="splash-spinner"></div>
  </div>
  <div id="app"></div>
  <script>
    // Vue mount 后调用此函数收起启动屏
    window.__removeSplash = function() {
      window.__splashDone = true;
      var el = document.getElementById('app-splash');
      if (el) {
        el.classList.add('fade-out');
        setTimeout(function() { el.remove(); }, 400);
      }
    };
    // 看门狗：若 8 秒内 Vue 未挂载（典型场景：浏览器缓存了旧版 index.html，
    // 其引用的旧哈希资源已不存在，模块脚本加载失败），在启动屏上给出
    // 「点击刷新」自救入口，带缓存破坏参数强制重新拉取 index.html
    setTimeout(function() {
      if (window.__splashDone) return;
      var el = document.getElementById('app-splash');
      if (!el || document.getElementById('splash-reload')) return;
      var tip = document.createElement('div');
      tip.style.cssText = 'margin-top:20px;font-size:13px;color:#8c7e6e;text-align:center;line-height:2;';
      tip.innerHTML = '页面资源加载失败（可能因浏览器缓存了旧版本）<br>' +
        '<a href="#" id="splash-reload" style="color:#d4852e;text-decoration:underline;">点击刷新重试</a>';
      el.appendChild(tip);
      document.getElementById('splash-reload').onclick = function(e) {
        e.preventDefault();
        location.replace(location.pathname + '?r=' + Date.now());
      };
    }, 8000);
  </script>
  <script type="module" src="/src/main.js"></script>
</body>
</html>
