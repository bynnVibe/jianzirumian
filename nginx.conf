# ============================================
# 见字如面 - Nginx 配置 (前端 → 后端代理)
# ============================================
server {
    listen 80;
    server_name _;

    # 前端静态文件
    root /usr/share/nginx/html;
    index index.html;

    # 上传体积上限：nginx 默认 1m，超过会直接 413 拒绝且请求到不了后端
    # （表现为上传/OCR 预览报错但后端无日志）
    client_max_body_size 50m;

    # 压缩传输：JS/CSS 可缩小约 70%，显著加快低带宽服务器的首屏加载
    gzip on;
    gzip_vary on;
    gzip_comp_level 5;
    gzip_min_length 1k;
    gzip_types text/plain text/css application/json application/javascript
               text/xml application/xml application/xml+rss text/javascript
               image/svg+xml;

    # 前端路由 (SPA)；index.html 不缓存，保证发版后立刻生效
    location / {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        try_files $uri $uri/ /index.html;
    }

    # Vite 带内容哈希的构建产物，长期缓存；
    # 缺失的哈希资源必须返回 404，不能回退 index.html——
    # 否则浏览器缓存的旧 index.html 请求旧资源时会拿到 HTML（MIME 不符），
    # 模块脚本被拒绝执行，页面永远停在启动屏
    location /assets/ {
        expires 30d;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # API 代理到后端
    location /api/ {
        proxy_pass http://${BACKEND_HOST}:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # OCR / LLM 调用耗时较长，放宽超时
        proxy_connect_timeout 60s;
        proxy_send_timeout 300s;
        proxy_read_timeout 300s;

        # SSE 支持：不缓冲流式响应
        proxy_buffering off;
        proxy_cache off;
        chunked_transfer_encoding on;
    }

    # 上传文件静态访问代理
    location /uploads/ {
        proxy_pass http://${BACKEND_HOST}:8000/uploads/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_read_timeout 300s;
    }
}
