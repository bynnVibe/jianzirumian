# ============================================
# 见字如面 - 宿主机 Nginx 边缘（公网 80 → 域名 HTTPS）完整模板
# ============================================
# 用法（备案通过后）：替换 server_name 与证书路径，放入 /etc/nginx/conf.d/，
#   nginx -t && systemctl reload nginx；安全组放行 443。
# 证书在宿主申请/存放（阿里云免费 DV 证书 Nginx 格式：*.pem 全链 + *.key），容器不持有证书。
#
# 可信代理链（必配，否则容器限流/审计拿不到真实客户端 IP）：
#   宿主经 127.0.0.1:5173 进容器，容器看到的直接来源为 compose 网桥网关；
#   在 backend/.env 设 EDGE_PROXY_CIDR=<网桥网关>/32（默认 172.30.0.1/32）并重建 frontend。
#
# 备案通过前：经域名走 80/443 会被阿里云接入校验拦截，此期间用 http://<公网IP>/ 访问；
#   本文件 80 段为备案后的 308 跳转，备案前请勿启用本文件（沿用纯 80 直连站点）。
# ============================================

# ---- 80：统一跳转 HTTPS ----
server {
    listen 80 default_server;
    server_name bynnhe.cn www.bynnhe.cn;
    return 308 https://$host$request_uri;
}

# ---- 443：终止 TLS 并反代回环 5173（容器内 Nginx 再路由 /api、/v1）----
server {
    listen 443 ssl default_server;
    server_name bynnhe.cn www.bynnhe.cn;

    # 替换为阿里云 DV 证书实际下载路径（Nginx 格式）
    ssl_certificate     /etc/nginx/certs/bynnhe.cn.pem;
    ssl_certificate_key /etc/nginx/certs/bynnhe.cn.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 10m;
    # 证书稳定、确认无 http 回退需求后再启用 HSTS
    # add_header Strict-Transport-Security "max-age=31536000" always;

    client_max_body_size 50m;

    # 边缘同样禁止指标/内部诊断公网访问（容器内已禁，双保险）
    location /metrics { return 403; }
    location /internal { return 404; }

    location / {
        proxy_pass http://127.0.0.1:5173;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";

        # SSE 流式响应不缓冲
        proxy_buffering off;
        proxy_cache off;

        proxy_connect_timeout 60s;
        # 须大于应用总预算（OCR/LLM 长请求）
        proxy_read_timeout 420s;
        proxy_send_timeout 420s;
    }
}
